<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>harpalyke - Entdecke neue Welten</title>
    <style>
        /* Farbpalette aus dem Logo extrahiert */
        :root {
            --bg-dark: #0b111e;       /* Das tiefe Dunkelblau aus dem Hintergrund */
            --text-light: #f5f5f7;    /* Das gebrochene Weiß der Buchstaben */
            --accent-orange: #f2994a; /* Das Orange des Planetenrings und des "l" */
            --card-bg: #161f30;       /* Etwas helleres Blau für Container */
        }

        body {
            font-family: 'Comfortaa', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header mit Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid rgba(242, 153, 74, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* SVG-Nachbau des Logos für gestochen scharfe Darstellung */
        .logo-icon {
            width: 50px;
            height: 50px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-text span {
            color: var(--accent-orange);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-orange);
        }

        /* Hero-Bereich (Hauptinhalt) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-badge {
            background-color: rgba(242, 153, 74, 0.15);
            color: var(--accent-orange);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid rgba(242, 153, 74, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 20px 0;
            line-height: 1.2;
        }

        h1 span {
            color: var(--accent-orange);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 40px;
            max-width: 600px;
        }

        /* Interaktiver Button */
        .cta-button {
            background-color: var(--accent-orange);
            color: var(--bg-dark);
            font-weight: bold;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(242, 153, 74, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(242, 153, 74, 0.6);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #718096;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Responsives Design für Mobilgeräte */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            header { flex-direction: column; gap: 15px; }
            nav a { margin: 0 10px; }
        }
    </style>
    <!-- Runder, moderner Font (Comfortaa) passend zum Logo-Stil -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo-area">
            <!-- Interaktive Planeten-Grafik, angelehnt an deine Bildvorlage -->
            <svg class="logo-icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="25" fill="#d4a373" />
                <!-- Streifen auf dem Planeten -->
                <path d="M27 42 Q50 48 73 42" stroke="#b17a4a" stroke-width="4" fill="none" />
                <path d="M25 55 Q50 62 75 55" stroke="#b17a4a" stroke-width="3" fill="none" />
                <!-- Großer roter Fleck -->
                <ellipse cx="60" cy="53" rx="6" ry="3" fill="#a63a2b" />
                <!-- Planetenring -->
                <ellipse cx="50" cy="50" rx="45" ry="12" fill="none" stroke="#f2994a" stroke-width="2" transform="rotate(-15 50 50)" />
                <!-- Kleiner Mond Harpalyke -->
                <circle cx="20" cy="30" r="3" fill="#cccccc" />
            </svg>
            <div class="logo-text">harpa<span>l</span>yke</div>
        </div>
        <nav>
            <a href="#features">Features</a>
            <a href="#ueber-uns">Über uns</a>
        </nav>
    </header>

    <main>
        <div class="hero-badge">Projekt geladen von GitHub Pages</div>
        <h1>Bereit für den <span>nächsten Orbit</span>?</h1>
        <p class="subtitle">Willkommen auf deiner neuen Testseite. Das Design wurde mathematisch exakt an die Ästhetik und die Kontraste deines Logos angepasst.</p>
        <button class="cta-button" onclick="startMission()">Mission starten</button>
    </main>

    <footer>
        <p>&copy; 2026 harpalyke. Rein privates Webprojekt zu Testzwecken.</p>
    </footer>

    <script>
        function startMission() {
            alert('🚀 Orbit erfolgreich erreicht! Deine HTML-Struktur steht und reagiert fehlerfrei.');
        }
    </script>

</body>
</html>
