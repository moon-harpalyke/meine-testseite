<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harpalyke</title>
<style>
  :root {
    --nacht: #090f1d;   /* Hintergrund des Logos */
    --creme: #f2efe8;   /* Schriftfarbe des Logos */
    --orange: #e08b3b;  /* Akzent aus Logo (Umlaufbahn, "l") */
    --creme-gedimmt: #a9a79f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--nacht);
    color: var(--creme);
    font-family: "Avenir Next", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    text-align: center;
  }
  main { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .logo {
    width: min(92vw, 1100px);
    height: auto;
    display: block;
  }
  .linie {
    width: 3.5rem;
    height: 3px;
    border-radius: 3px;
    background: var(--orange);
    margin: 1.5rem 0 1.25rem;
  }
  p { margin: 0; font-size: clamp(1rem, 2.2vw, 1.25rem); letter-spacing: .04em; color: var(--creme-gedimmt); }
  .hinweis { margin-top: .75rem; font-size: clamp(.85rem, 1.8vw, 1rem); color: var(--orange); }
  .info { max-width: 38rem; margin-top: 2.5rem; font-size: clamp(.85rem, 1.8vw, 1rem); line-height: 1.6; letter-spacing: .02em; color: var(--creme-gedimmt); }
  body { padding-bottom: 4.5rem; }
  footer { position: absolute; bottom: 1.25rem; font-size: .8rem; color: #5d6070; }

  /* ---------- Comic rocket ---------- */
  :root { --ink: #090f1d; --gelb: #ffd23f; --rot: #c8452c; }
  .stage { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .pad { position: absolute; right: max(5vw, 20px); bottom: 3.5rem; width: clamp(56px, 9vw, 84px); }
  #rocket { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; pointer-events: auto; will-change: transform; }
  #rocket:focus-visible { outline: 3px dashed var(--orange); outline-offset: 8px; }
  #flame { display: none; transform-origin: 50% 0; animation: flackern .12s infinite alternate; }
  .zuendung #flame { display: block; }
  @keyframes flackern { from { transform: scaleY(.85) scaleX(1.05); } to { transform: scaleY(1.15) scaleX(.9); } }
  .wackeln { animation: wackeln .08s infinite alternate; }
  @keyframes wackeln { from { transform: translate(-2px, 0) rotate(-1.2deg); } to { transform: translate(2px, -1px) rotate(1.2deg); } }
  .puff { position: absolute; left: 50%; bottom: 0; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%;
          background: var(--creme); border: 4px solid #2b3552; box-shadow: inset -6px -6px 0 rgba(43,53,82,.28); }
  .zaehler { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 1.2rem;
             font: 400 clamp(2.6rem, 8vw, 4.5rem)/1 "Bangers", "Comic Sans MS", "Chalkboard SE", Impact, sans-serif;
             color: var(--gelb); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
             text-shadow: 4px 4px 0 var(--orange); }
  .knall { position: absolute; right: 100%; bottom: 55%; width: clamp(120px, 20vw, 190px); aspect-ratio: 1.25;
           margin-right: .5rem; opacity: 0; transform: rotate(-10deg) scale(.3);
           filter: drop-shadow(5px 5px 0 var(--orange)); }
  .knall span { display: grid; place-items: center; width: 100%; height: 100%; background: var(--gelb);
                clip-path: polygon(50% 0,60% 18%,80% 5%,78% 28%,100% 30%,85% 48%,100% 65%,78% 70%,82% 95%,60% 82%,50% 100%,40% 82%,18% 95%,22% 70%,0 65%,15% 48%,0 30%,22% 28%,20% 5%,40% 18%);
                font: 400 clamp(1.1rem, 3vw, 1.7rem)/1 "Bangers", "Comic Sans MS", "Chalkboard SE", Impact, sans-serif;
                color: var(--ink); letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { #flame, .wackeln { animation: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <img class="logo" src="logo.jpg" alt="harpalyke – Logo mit gestreiftem Planeten auf einer Umlaufbahn">
    <div class="linie"></div>
    <p>Welcome!</p>
    <p class="hinweis">This page is for testing purposes only.</p>
    <p class="info">Harpalyke (Jupiter XXII; S/2000 J 5) is a retrograde irregular moon of Jupiter, discovered by Scott S. Sheppard’s team on 23 November 2000. </p> It is named after a daughter of Clymenus in Greek mythology.</p>
  </main>
  <footer>© 2026 harpalyke</footer>

  <div class="stage" aria-hidden="false">
    <div class="pad">
      <div class="zaehler" id="zaehler" aria-hidden="true"></div>
      <div class="knall" id="knall" aria-hidden="true"><span>WHOOSH!</span></div>
      <svg id="rocket" viewBox="0 0 100 220" role="button" tabindex="0" aria-label="Rocket – click to launch again">
        <g id="flame">
          <path d="M30 148 Q50 225 70 148 Z" fill="#e08b3b" stroke="#090f1d" stroke-width="4" stroke-linejoin="round"/>
          <path d="M40 148 Q50 195 60 148 Z" fill="#ffd23f"/>
        </g>
        <path d="M28 100 L5 150 L5 168 L35 148 Z" fill="#c8452c" stroke="#090f1d" stroke-width="5" stroke-linejoin="round"/>
        <path d="M72 100 L95 150 L95 168 L65 148 Z" fill="#c8452c" stroke="#090f1d" stroke-width="5" stroke-linejoin="round"/>
        <path d="M50 6 C82 38 80 100 75 150 L25 150 C20 100 18 38 50 6 Z" fill="#f2efe8" stroke="#090f1d" stroke-width="5" stroke-linejoin="round"/>
        <path d="M50 6 C62 18 70 31 74 48 L26 48 C30 31 38 18 50 6 Z" fill="#e08b3b" stroke="#090f1d" stroke-width="4" stroke-linejoin="round"/>
        <path d="M24 128 L76 128 L75 150 L25 150 Z" fill="#e08b3b" stroke="#090f1d" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="50" cy="84" r="15" fill="#8fd0e8" stroke="#090f1d" stroke-width="5"/>
        <path d="M42 80 Q45 73 52 73" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <script>
  (function () {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var rocket = document.getElementById("rocket"),
        pad = rocket.parentNode,
        zaehler = document.getElementById("zaehler"),
        knall = document.getElementById("knall"),
        busy = false;
    var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

    function puff() {
      var p = document.createElement("div");
      p.className = "puff";
      pad.appendChild(p);
      var dx = (Math.random() - 0.5) * 150, s = 1.4 + Math.random() * 1.6;
      p.animate([
        { transform: "translate(0,0) scale(.4)", opacity: 1 },
        { transform: "translate(" + dx + "px,-" + (10 + Math.random() * 40) + "px) scale(" + s + ")", opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: "ease-out" }).onfinish = function () { p.remove(); };
    }

    async function launch() {
      if (busy) return;
      busy = true;
      rocket.classList.add("wackeln");
      for (var n = 3; n > 0; n--) { zaehler.textContent = n; await wait(650); }
      zaehler.textContent = "";
      rocket.classList.remove("wackeln");
      rocket.classList.add("zuendung");
      knall.animate([
        { opacity: 0, transform: "rotate(-10deg) scale(.3)" },
        { opacity: 1, transform: "rotate(-10deg) scale(1.1)", offset: .15 },
        { opacity: 1, transform: "rotate(-10deg) scale(1)", offset: .7 },
        { opacity: 0, transform: "rotate(-10deg) scale(1.05)" }
      ], { duration: 1800, fill: "forwards" });
      var smoke = setInterval(puff, 70);
      setTimeout(function () { clearInterval(smoke); }, 1500);
      var up = pad.getBoundingClientRect().bottom + 260;
      await rocket.animate([
        { transform: "translateY(0)" },
        { transform: "translateY(-" + up + "px) rotate(2deg)" }
      ], { duration: 2400, easing: "cubic-bezier(.55,0,1,.55)", fill: "forwards" }).finished;
      rocket.classList.remove("zuendung");
      await wait(1200);
      rocket.style.display = "none";
    }

    rocket.addEventListener("click", launch);
    rocket.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); launch(); }
    });
    if (!reduce) setTimeout(launch, 900);
  })();
  </script>
</body>
</html>
